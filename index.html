<!DOCTYPE html>
<html lang="en">
<head>

</head>

  <header>
    <nav>
      <div class="nav-title">Security+ SY0-701 Study App</div>
      <div class="nav-links">
        <a href="#" data-view="home" class="nav-link active">Home</a>
